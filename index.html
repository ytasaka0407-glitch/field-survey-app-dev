<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>現地調査レポート作成ツール</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/field-survey-app/FieldSurveyApp/manifest.webmanifest">
    <meta name="theme-color" content="#2d7ef7">

    <!-- iOS向け（任意） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="./FieldSurveyApp/icons/icon-192.png">

    <!-- ExcelJS（ローカル配置に変更） -->
    <script src="./lib/exceljs.min.js"></script>
    <!-- FileSaver（ローカル配置に変更） -->
    <script src="./lib/FileSaver.min.js"></script>

    <!-- 外部CSS（FieldSurveyApp配下のassets） -->
    <link rel="stylesheet" href="./FieldSurveyApp/assets/css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>現地調査レポート作成</h1>
    </header>

    <main class="container">
      <!-- 案件全体の情報 -->
      <section class="card">
        <h2>案件情報（エクセル表紙）</h2>
        <div class="form-row">
          <label for="projectTitle">案件名</label>
          <input id="projectTitle" type="text" placeholder="例：西いぶり、神戸など" />
        </div>
        <div class="form-row">
          <label for="projectDate">調査日</label>
          <input id="projectDate" type="date" />
        </div>
      </section>

      <!-- 項目選択 -->
      <section class="card">
        <h2>項目選択（エクセル目次・項目別シートに反映）</h2>

        <div class="category-groups" id="categorySelectArea">
          <!-- JSで「消防本部項目」「基地局項目」それぞれのチェック群を描画 -->
        </div>

        <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <div class="muted">消防本部項目を追加</div>
            <div class="add-category">
              <input id="newSingleCategoryInput" type="text" placeholder="" />
              <button id="addSingleCategoryBtn" class="btn">追加</button>
            </div>
          </div>
          <div>
            <div class="muted">基地局項目を追加</div>
            <div class="add-category">
              <input id="newMultiCategoryInput" type="text" placeholder="" />
              <button id="addMultiCategoryBtn" class="btn">追加</button>
            </div>
          </div>
        </div>

        <!-- 共有 基地局 管理 -->
        <div class="shared-stations" id="sharedStationsManager">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
            <div style="font-weight:bold;">基地局入力</div>
            <div style="display:flex; gap:8px; flex:1 1 420px;">
              <input id="newStationInput" type="text" placeholder="基地局名を入力" />
              <button id="addStationBtn" class="btn">基地局を追加</button>
            </div>
          </div>
          <div class="station-list" id="stationList"></div>
          <div class="muted" style="margin-top:6px;">追加した基地局は、すべての基地局項目が自動で反映され、入力は「基地局単位」で行います。</div>
        </div>
      </section>

      <!-- 入力 -->
      <section class="card">
        <h2>調査結果入力欄</h2>
        <div id="singleCatsContainer"></div>
        <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">
        <div>
          <h3 style="margin-bottom:8px;">基地局別</h3>
          <div id="multiStationsContainer"></div>
        </div>
      </section>
    </main>

    <!-- 常時表示の操作バー -->
    <div class="floating-controls">
      <button id="clearBtn" class="btn danger">クリア</button>
      <button id="saveBtn" class="btn">下書き保存</button>
      <button id="loadBtn" class="btn">下書き再表示</button>
      <button id="exportExcelBtn" class="btn success">Excel出力</button>
      <button id="importExcelBtn" class="btn mint">Excel読み込み</button>
      <input id="importExcelFile" type="file" accept=".xlsx" style="display:none" />
    </div>

    <footer class="app-footer">
    </footer>

    <script type="module" src="./FieldSurveyApp/assets/js/main.js"></script>
  </body>
</html>
