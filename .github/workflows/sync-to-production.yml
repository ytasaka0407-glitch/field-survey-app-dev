name: Sync Public Files to Production

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository root files:"
          pwd
          ls -la
          echo "Recursive file list:"
          find . -maxdepth 5 -type f | sort

      - name: Prepare release files
        run: |
          mkdir -p release
          mkdir -p release/FieldSurveyApp

          cp index.html release/
          cp service-worker.js release/

          if [ -f FieldSurveyApp/manifest.webmanifest ]; then
            cp FieldSurveyApp/manifest.webmanifest release/FieldSurveyApp/
          fi

          if [ -d FieldSurveyApp/assets ]; then
            cp -r FieldSurveyApp/assets release/FieldSurveyApp/
          fi

          if [ -d FieldSurveyApp/icons ]; then
            cp -r FieldSurveyApp/icons release/FieldSurveyApp/
          fi

          if [ -d lib ]; then
            cp -r lib release/
          fi

      - name: Show release files
        run: |
          echo "Release files:"
          find release -type f | sort

      - name: Push release files to production repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PROD_REPO_TOKEN }}
        with:
          source-directory: "release"
          destination-github-username: "ytasaka0407-glitch"
          destination-repository-name: "field-survey-app"
          user-email: "github-actions[bot]@users.noreply.github.com"
          user-name: "github-actions[bot]"
          target-branch: "main"
